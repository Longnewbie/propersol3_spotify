<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/swLogo2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>Soundwave - Discover & Enjoy Music</title>
    <meta
      name="description"
      content="Soundwave - nghe nhạc trực tuyến, khám phá bài hát nổi bật và playlist dành riêng cho bạn."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="Soundwave, music, streaming, nghe nhạc, playlist, songs, albums"
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Author -->
    <meta name="author" content="Soundwave Team" />

    <!-- Open Graph (Facebook, LinkedIn, Zalo, etc.) -->
    <meta property="og:site_name" content="Soundwave" />
    <meta property="og:title" content="Soundwave - Discover & Enjoy Music" />
    <meta
      property="og:description"
      content="Nghe nhạc trực tuyến miễn phí, khám phá bài hát và album hot nhất cùng Soundwave."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gialong.io.vn" />
    <meta property="og:image" content="https://gialong.io.vn/swLogo2.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soundwave - Discover & Enjoy Music" />
    <meta
      name="twitter:description"
      content="Khám phá bài hát, album và playlist hot nhất trên Soundwave."
    />
    <meta name="twitter:image" content="https://gialong.io.vn/swLogo2.png" />

    <!-- Canonical link -->
    <link rel="canonical" href="https://gialong.io.vn" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Soundwave",
        "url": "https://gialong.io.vn",
        "logo": "https://gialong.io.vn/swLogo2.png",
        "description": "Soundwave - nghe nhạc trực tuyến, khám phá bài hát, album và playlist dành riêng cho bạn."
      }
    </script>

    <!-- Theme color for mobile -->
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
